<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Bus Pass – Zcoer Bus Pass</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2b7ec1;
            --primary-dark: #1a5c8a;
            --primary-light: #e8f4fd;
            --primary-50: #f0f8ff;
            --bg: #f0f6fa;
            --card-bg: #ffffff;
            --text-dark: #1a2a3a;
            --text-body: #4a5a6a;
            --text-muted: #8a9aaa;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.10);
            --radius: 12px;
            --radius-lg: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text-body);
            line-height: 1.6;
        }

        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 40px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            font-size: 1.1rem; font-weight: 700;
            color: var(--text-dark); text-decoration: none;
        }
        .nav-brand span { color: var(--primary); }
        .back-link {
            color: var(--text-muted); text-decoration: none; font-size: 0.875rem;
            display: flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .back-link:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-50); }

        .page-wrapper {
            max-width: 560px;
            margin: 40px auto;
            padding: 0 20px 60px;
        }
        .page-header { text-align: center; margin-bottom: 36px; }
        .page-icon {
            width: 60px; height: 60px;
            background: var(--primary-light);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
            color: var(--primary);
        }
        .page-header h1 {
            font-size: 1.8rem; font-weight: 800; margin-bottom: 8px;
            color: var(--text-dark);
        }
        .page-header p { color: var(--text-muted); font-size: 0.95rem; }

        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px;
            box-shadow: var(--shadow-md);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--bg);
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(43,126,193,0.12);
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(43,126,193,0.3);
        }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-secondary {
            background: var(--bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            width: 100%;
            margin-top: 14px;
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

        .upload-row {
            margin: 16px 0 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--bg);
            border-radius: 10px;
        }
        .upload-row label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-body);
            white-space: nowrap;
        }
        .upload-row input[type="file"] {
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .alert {
            padding: 14px 18px; border-radius: 10px;
            font-size: 0.88rem; font-weight: 500;
            display: none; margin-bottom: 20px;
            border: 1px solid;
        }
        .alert-success { background: #eafaf1; border-color: #a8e6c1; color: #1a7a42; }
        .alert-error   { background: #fdecea; border-color: #f5b7b1; color: #922b21; }
        .alert-info    { background: var(--primary-light); border-color: #aed6f1; color: var(--primary-dark); }

        .pass-details {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            margin-top: 24px;
            display: none;
        }
        .pass-details h3 {
            color: var(--primary);
            margin-bottom: 16px;
            font-size: 1.1rem;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-weight: 600; color: var(--text-dark); font-size: 0.9rem; }
        .detail-value { color: var(--text-muted); font-size: 0.9rem; }
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 14px;
            font-size: 0.9rem;
        }
        .status-valid { background: #eafaf1; color: #1a7a42; }
        .status-expired { background: #fdecea; color: #922b21; }
        .status-invalid { background: #fdecea; color: #922b21; }

        .loading { display: none; text-align: center; margin: 20px 0; }
        .spinner {
            border: 4px solid var(--primary-light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 36px; height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .qr-preview { margin: 20px 0; }
        .qr-preview img { max-width: 140px; border: 2px solid var(--border); border-radius: 8px; padding: 4px; background: var(--card-bg); }

        @media(max-width:600px){
            .input-group { flex-direction: column; }
            .form-card { padding: 24px 18px; }
            nav { padding: 12px 16px; }
            .upload-row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html" class="nav-brand">
            <svg width="28" height="28" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="36" height="36" rx="10" fill="#2b7ec1"/>
                <path d="M10 26V14h16v12H10z" fill="#fff" opacity="0.9"/>
                <rect x="13" y="16" width="4" height="4" rx="1" fill="#2b7ec1"/>
                <rect x="19" y="16" width="4" height="4" rx="1" fill="#2b7ec1"/>
                <rect x="10" y="14" width="16" height="3" rx="1" fill="#1a5c8a"/>
                <circle cx="13" cy="27" r="2" fill="#fff"/>
                <circle cx="23" cy="27" r="2" fill="#fff"/>
            </svg>
            <span><span>zcoer</span> Bus Pass</span>
        </a>
        <a href="../index.html" class="back-link">← Back to Home</a>
    </nav>

    <div class="page-wrapper">
        <div class="page-header">
            <div class="page-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <h1>Verify Bus Pass</h1>
            <p>Scan QR code or enter pass number to verify authenticity</p>
        </div>

        <div class="form-card">
            <div id="alert" class="alert"></div>

            <div class="input-group">
                <input type="text" id="passInput" placeholder="Enter Pass Number or scan QR code..." autofocus>
                <button class="btn btn-primary" onclick="verifyPass()">Verify</button>
            </div>

            <div class="upload-row">
                <label for="qrFile">Or upload QR code image:</label>
                <input type="file" id="qrFile" accept="image/*" onchange="handleQRUpload()">
            </div>

            <div id="loadingSection" class="loading">
                <div class="spinner"></div>
                <p>Verifying pass...</p>
            </div>

            <div id="passDetails" class="pass-details">
                <h3>Pass Verified</h3>
                <div class="detail-row">
                    <span class="detail-label">Pass Number:</span>
                    <span class="detail-value" id="verifiedPassNumber"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Passenger Name:</span>
                    <span class="detail-value" id="verifiedPassName"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Pass Type:</span>
                    <span class="detail-value" id="verifiedPassType"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Issue Date:</span>
                    <span class="detail-value" id="verifiedIssueDate"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Expiry Date:</span>
                    <span class="detail-value" id="verifiedExpiryDate"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">User Type:</span>
                    <span class="detail-value" id="verifiedUserType"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status:</span>
                    <span class="detail-value" id="verifiedStatus"></span>
                </div>
                <div id="statusBadge" class="status-badge"></div>
                <button class="btn btn-secondary" onclick="resetVerification()">Verify Another Pass</button>
            </div>
        </div>
    </div>

    <script>
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.className = 'alert alert-' + type;
            alertDiv.style.display = 'block';
        }
        function showLoading(show) {
            document.getElementById('loadingSection').style.display = show ? 'block' : 'none';
        }
        async function verifyPass() {
            const passInput = document.getElementById('passInput').value.trim();
            if (!passInput) { showAlert('Please enter a Pass Number', 'error'); return; }
            showLoading(true);
            try {
                const response = await fetch('../api/pass.php?action=verify_pass&pass_number=' + encodeURIComponent(passInput));
                const result = await response.json();
                if (result.success) { displayVerifiedPass(result.data); }
                else { showAlert('Pass verification failed: ' + (result.error || 'Invalid or inactive pass'), 'error'); document.getElementById('passDetails').style.display = 'none'; }
            } catch (error) { showAlert('Error: ' + error.message, 'error'); document.getElementById('passDetails').style.display = 'none'; }
            finally { showLoading(false); }
        }
        function displayVerifiedPass(pass) {
            const isValid = new Date(pass.expiry_date) > new Date() && pass.status === 'active';
            document.getElementById('verifiedPassNumber').textContent = pass.pass_number;
            document.getElementById('verifiedPassName').textContent = pass.first_name + ' ' + pass.last_name;
            document.getElementById('verifiedPassType').textContent = pass.pass_type;
            document.getElementById('verifiedIssueDate').textContent = formatDate(pass.issue_date);
            document.getElementById('verifiedExpiryDate').textContent = formatDate(pass.expiry_date);
            document.getElementById('verifiedUserType').textContent = pass.user_type;
            document.getElementById('verifiedStatus').textContent = pass.status;
            const badge = document.getElementById('statusBadge');
            if (isValid) { badge.textContent = 'VALID'; badge.className = 'status-badge status-valid'; showAlert('Pass is valid and active', 'success'); }
            else { badge.textContent = 'EXPIRED / INVALID'; badge.className = 'status-badge status-expired'; showAlert('Pass is expired or invalid', 'error'); }
            document.getElementById('passDetails').style.display = 'block';
        }
        function handleQRUpload() {
            const file = document.getElementById('qrFile').files[0];
            if (file) { showAlert('QR code image uploaded. Please enter pass number to verify.', 'info'); }
        }
        function resetVerification() {
            document.getElementById('passInput').value = '';
            document.getElementById('qrFile').value = '';
            document.getElementById('passDetails').style.display = 'none';
            document.getElementById('alert').style.display = 'none';
            document.getElementById('passInput').focus();
        }
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-IN');
        }
        document.getElementById('passInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { verifyPass(); }
        });
    </script>
</body>
</html>

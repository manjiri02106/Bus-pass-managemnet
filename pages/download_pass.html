<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download & Print Bus Pass – Zcoer Bus Pass</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2b7ec1;
            --primary-dark: #1a5c8a;
            --primary-light: #e8f4fd;
            --primary-50: #f0f8ff;
            --bg: #f0f6fa;
            --card-bg: #ffffff;
            --text-dark: #1a2a3a;
            --text-body: #4a5a6a;
            --text-muted: #8a9aaa;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.10);
            --radius: 12px;
            --radius-lg: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text-body);
            line-height: 1.6;
        }

        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 40px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            font-size: 1.1rem; font-weight: 700;
            color: var(--text-dark); text-decoration: none;
        }
        .nav-brand span { color: var(--primary); }
        .back-link {
            color: var(--text-muted); text-decoration: none; font-size: 0.875rem;
            display: flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .back-link:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-50); }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px 60px;
        }

        .page-header { text-align: center; margin-bottom: 36px; }
        .page-icon {
            width: 60px; height: 60px;
            background: var(--primary-light);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
            color: var(--primary);
        }
        .page-header h1 {
            font-size: 1.8rem; font-weight: 800; margin-bottom: 8px;
            color: var(--text-dark);
        }
        .page-header p { color: var(--text-muted); font-size: 0.95rem; }

        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px;
            box-shadow: var(--shadow-md);
        }

        .search-section {
            background: var(--bg);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 28px;
        }
        .search-section h3 {
            font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; color: var(--text-dark);
        }
        .search-group {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 12px;
        }
        input[type="text"],
        input[type="email"],
        select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--card-bg);
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(43,126,193,0.12);
        }
        .btn-search {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: all 0.25s;
        }
        .btn-search:hover { background: var(--primary-dark); }
        .btn-search.secondary { background: var(--text-muted); }
        .btn-search.secondary:hover { background: #6b7a8a; }

        .alert {
            padding: 14px 18px; border-radius: 10px;
            font-size: 0.88rem; font-weight: 500;
            display: none; margin-bottom: 20px;
            border: 1px solid;
        }
        .alert-success { background: #eafaf1; border-color: #a8e6c1; color: #1a7a42; }
        .alert-error   { background: #fdecea; border-color: #f5b7b1; color: #922b21; }
        .alert-info    { background: var(--primary-light); border-color: #aed6f1; color: var(--primary-dark); }

        .passes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .pass-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            transition: all 0.25s;
            box-shadow: var(--shadow-sm);
        }
        .pass-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }
        .pass-card h3 {
            color: var(--primary); margin-bottom: 14px; font-size: 1.05rem;
            font-weight: 700;
        }
        .pass-info {
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .pass-info strong { color: var(--text-body); }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .status-active { background: #eafaf1; color: #1a7a42; }
        .status-expired { background: #fdecea; color: #922b21; }
        .status-pending { background: #fef9e7; color: #7d6608; }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
        }
        .btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .btn-download { background: #eafaf1; color: #1a7a42; }
        .btn-download:hover { background: #d5f0e3; }
        .btn-print { background: var(--primary-light); color: var(--primary); }
        .btn-print:hover { background: #d4eaf9; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state h3 { color: var(--text-body); margin-bottom: 8px; }
        .loading { text-align: center; padding: 30px; color: var(--primary); }
        .spinner {
            border: 4px solid var(--primary-light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media(max-width:600px){
            .search-group { grid-template-columns: 1fr; }
            .form-card { padding: 20px 16px; }
            nav { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html" class="nav-brand">
            <svg width="28" height="28" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="36" height="36" rx="10" fill="#2b7ec1"/>
                <path d="M10 26V14h16v12H10z" fill="#fff" opacity="0.9"/>
                <rect x="13" y="16" width="4" height="4" rx="1" fill="#2b7ec1"/>
                <rect x="19" y="16" width="4" height="4" rx="1" fill="#2b7ec1"/>
                <rect x="10" y="14" width="16" height="3" rx="1" fill="#1a5c8a"/>
                <circle cx="13" cy="27" r="2" fill="#fff"/>
                <circle cx="23" cy="27" r="2" fill="#fff"/>
            </svg>
            <span><span>zcoer</span> Bus Pass</span>
        </a>
        <a href="../index.html" class="back-link">← Back to Home</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <div class="page-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </div>
            <h1>Download &amp; Print Bus Pass</h1>
            <p>Download your bus pass in PDF, PNG, or JPG format</p>
        </div>

        <div class="form-card">
            <div id="alert" class="alert"></div>

            <div class="search-section">
                <h3>Search Your Pass</h3>
                <div class="search-group">
                    <input type="text" id="searchPassNumber" placeholder="Search by Pass Number">
                    <input type="email" id="searchEmail" placeholder="Search by Email">
                    <button class="btn-search" onclick="searchPasses()">Search</button>
                </div>
                <button class="btn-search secondary" style="width:100%; margin-top:8px;" onclick="loadAllPasses()">Load All Passes</button>
            </div>

            <div id="loadingSection" class="loading" style="display:none;">
                <div class="spinner"></div>
                <p>Loading your passes...</p>
            </div>

            <div id="emptyState" class="empty-state">
                <h3>No passes found</h3>
                <p>Click "Load All Passes" or search to find your bus passes.</p>
            </div>

            <div id="passesContainer" class="passes-grid"></div>
        </div>
    </div>

    <script>
        let currentPasses = [];

        async function searchPasses() {
            const passNumber = document.getElementById('searchPassNumber').value;
            const email = document.getElementById('searchEmail').value;

            if (!passNumber && !email) {
                showAlert('Please enter a Pass Number or Email to search', 'error');
                return;
            }

            showLoading(true);

            try {
                let url = '../api/pass.php?action=get_pass';
                if (passNumber) url += '&pass_number=' + encodeURIComponent(passNumber);
                if (email) url += '&email=' + encodeURIComponent(email);

                const response = await fetch(url);
                const result = await response.json();

                if (result.success && result.data) {
                    currentPasses = Array.isArray(result.data) ? result.data : [result.data];
                    displayPasses(currentPasses);
                } else {
                    currentPasses = [];
                    document.getElementById('passesContainer').innerHTML = '';
                    document.getElementById('emptyState').style.display = 'block';
                    showAlert('No passes found matching your search', 'info');
                }
            } catch (error) { showAlert('Error: ' + error.message, 'error'); }
            finally { showLoading(false); }
        }

        async function loadAllPasses() {
            showLoading(true);
            try {
                const response = await fetch('../api/pass.php?action=get_pass&all=true');
                const result = await response.json();
                if (result.success && result.data) {
                    currentPasses = Array.isArray(result.data) ? result.data : [result.data];
                    displayPasses(currentPasses);
                } else { showAlert('Could not load all passes. Please search by Pass Number or Email instead.', 'info'); }
            } catch (error) { showAlert('Error loading passes. Please search by Pass Number or Email instead.', 'info'); }
            finally { showLoading(false); }
        }

        function displayPasses(passes) {
            const container = document.getElementById('passesContainer');
            document.getElementById('emptyState').style.display = passes.length === 0 ? 'block' : 'none';
            if (passes.length === 0) { container.innerHTML = ''; return; }

            container.innerHTML = passes.map(pass => {
                const status = new Date(pass.expiry_date) > new Date() ? 'active' : 'expired';
                const statusClass = 'status-' + status;
                const statusText = status === 'active' ? 'Active' : 'Expired';

                return `
                    <div class="pass-card">
                        <h3>${pass.pass_number || 'N/A'}</h3>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        <div class="pass-info"><strong>Passenger:</strong> ${pass.first_name} ${pass.last_name}</div>
                        <div class="pass-info"><strong>Pass Type:</strong> ${pass.pass_type || 'N/A'}</div>
                        <div class="pass-info"><strong>Issue Date:</strong> ${formatDate(pass.issue_date)}</div>
                        <div class="pass-info"><strong>Expiry Date:</strong> ${formatDate(pass.expiry_date)}</div>
                        <div class="pass-info"><strong>Email:</strong> ${pass.email}</div>
                        <div class="btn-group">
                            <button class="btn btn-download" onclick="downloadPass(${pass.id}, 'pdf')">📥 PDF</button>
                            <button class="btn btn-print" onclick="printPass(${pass.id})">🖨️ Print</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function downloadPass(passId, format) {
            window.location.href = '../api/pass.php?action=download_pass&pass_id=' + passId + '&format=' + format;
        }
        function printPass(passId) {
            window.open('../api/pass.php?action=get_pass&pass_id=' + passId + '&format=print', '_blank');
        }
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.className = 'alert alert-' + type;
            alertDiv.style.display = 'block';
        }
        function showLoading(show) {
            document.getElementById('loadingSection').style.display = show ? 'block' : 'none';
        }
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-IN');
        }
        document.addEventListener('DOMContentLoaded', loadAllPasses);
    </script>
</body>
</html>
